version: 2

project_name: konet

before:
  hooks:
    - go mod tidy

builds:
  - id: konet
    main: ./main.go
    binary: konet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # One entry, not two: written as two list items the windows override
    # carried no format and the zip entry carried no goos, so Windows shipped a
    # .tar.gz that neither the Scoop manifest nor a hand-download expects.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: raucheacho
    name: konet

homebrew_casks:
  - name: konet
    repository:
      owner: raucheacho
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/raucheacho/konet"
    description: "Konet — realtime infrastructure engine"
    license: "MIT"
    hooks:
      post:
        install: |
          bin.install "konet"

scoops:
  - name: konet
    repository:
      owner: raucheacho
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/raucheacho/konet"
    description: "Konet — realtime infrastructure engine"
    license: MIT
