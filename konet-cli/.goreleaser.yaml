version: 2

project_name: konet

before:
  hooks:
    - go mod tidy

builds:
  - id: konet
    main: ./main.go
    binary: konet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - src: ../LICENSE
      - src: ../README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: raucheacho
    name: konet

brews:
  - name: konet
    repository:
      owner: raucheacho
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://konet.io"
    description: "Konet — realtime infrastructure engine"
    license: "MIT"
    install: |
      bin.install "konet"
    test: |
      system "#{bin}/konet", "--version"

scoops:
  - name: konet
    repository:
      owner: raucheacho
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: "https://konet.io"
    description: "Konet — realtime infrastructure engine"
    license: MIT
