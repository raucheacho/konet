name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let a running one finish — cancelling a
# half-applied Pages deployment is worse than waiting for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # base_path is "/konet" for a project site and empty for a custom domain;
      # next.config.js normalises both.
      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Nextra emits _next/, and a leading underscore makes Jekyll skip the
      # directory. Harmless when Jekyll never runs, fatal when it does.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          # Relative to the workspace: `defaults.run.working-directory` only
          # applies to `run` steps, not to actions.
          path: docs/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
