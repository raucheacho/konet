name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # Build provenance: lets anyone check that an archive was built by this
  # workflow from this repository (`gh attestation verify`). Releases used to
  # carry nothing but a checksums file published next to them.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: konet-cli/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: konet-cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            konet-cli/dist/*.tar.gz
            konet-cli/dist/*.zip
            konet-cli/dist/*_checksums.txt
