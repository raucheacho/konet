name: Release SDK — Go

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tag-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify module
        working-directory: sdk/go
        run: go mod tidy && go build ./...

      # A re-run must be safe, but a real failure (protected tags, missing
      # permissions) must not leave the job green with nothing published — which
      # `|| echo` did for both commands.
      - name: Create SDK tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="sdk/go/v${{ steps.version.outputs.VERSION }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG is already published — nothing to do."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
          echo "Published $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
