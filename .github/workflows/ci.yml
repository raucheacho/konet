name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server:
    name: Server (Elixir)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: konet-server
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2"

      - uses: actions/cache@v4
        with:
          path: |
            konet-server/deps
            konet-server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('konet-server/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  # GoReleaser runs with workdir: konet-cli and refuses archive paths outside
  # it, so `files: [- src: ../LICENSE]` fails and the two files have to exist as
  # copies. Nothing kept them in sync, and the CLI README drifted far enough to
  # still advertise three SDKs — that stale copy shipped inside every release
  # archive.
  cli-docs-in-sync:
    name: CLI (docs in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check konet-cli copies match the root
        run: |
          status=0
          for file in README.md LICENSE; do
            if ! diff -q "$file" "konet-cli/$file" >/dev/null; then
              echo "::error file=konet-cli/$file::konet-cli/$file has drifted from ./$file."
              echo "  These are shipped inside the release archives. Refresh with:"
              echo "    cp $file konet-cli/$file"
              diff -u "$file" "konet-cli/$file" || true
              status=1
            fi
          done
          exit $status

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: konet-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: konet-cli/go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  sdk-go:
    name: SDK (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - run: go build ./...
      - run: go vet ./...
      # -race because the client runs a read loop and a heartbeat loop against
      # shared channel state; the reconnect path is exactly where that races.
      - run: go test -race ./...

  sdk-js:
    name: SDK (JavaScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk-react-native:
    name: SDK (React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/react-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The core is a peer dependency resolved from the sibling package (see
      # this package's tsconfig "paths" and vitest alias), not from npm — where
      # the matching version only appears once the release tag publishes it.
      # --legacy-peer-deps stops npm trying to fetch a peer that is right here.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk-python:
    name: SDK (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # compileall alone is a syntax check: it never ran tests/, so the binary
      # framing and the reconnect state machine were unverified in CI.
      - run: pip install -e '.[dev]'
      - run: python -m compileall konet
      - run: pytest -q

  docs:
    name: Docs (Nextra)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # A static export, so a bad MDX link or a component used without an
      # import fails the build instead of shipping a broken page.
      - run: bun run build
