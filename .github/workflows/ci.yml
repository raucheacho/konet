name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server:
    name: Server (Elixir)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: konet-server
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16.3"
          otp-version: "26.2"

      - uses: actions/cache@v4
        with:
          path: |
            konet-server/deps
            konet-server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('konet-server/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: konet-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: konet-cli/go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  sdk-go:
    name: SDK (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - run: go build ./...
      - run: go vet ./...

  sdk-js:
    name: SDK (JavaScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

  sdk-python:
    name: SDK (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m compileall konet
